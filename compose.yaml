services:
  postgres:
    image: postgres:18.3
    container_name: chefduplacard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chefduplacard
      POSTGRES_USER: chefduplacard
      POSTGRES_PASSWORD: chefduplacard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
