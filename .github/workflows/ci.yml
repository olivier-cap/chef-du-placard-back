name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: chefduplacard
          POSTGRES_USER: chefduplacard
          POSTGRES_PASSWORD: chefduplacard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build et tests Maven
        run: ./mvnw -B clean verify
        env:
          APP_DB_URL: jdbc:postgresql://localhost:5432/chefduplacard
          APP_DB_USER: chefduplacard
          APP_DB_PASSWORD: chefduplacard