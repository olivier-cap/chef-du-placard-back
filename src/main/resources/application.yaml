spring:
  application:
    name: chefduplacard

  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/chefduplacard}
    username: ${APP_DB_USER:chefduplacard}
    password: ${APP_DB_PASSWORD:chefduplacard}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
  
    api-docs:
      path: /api-docs